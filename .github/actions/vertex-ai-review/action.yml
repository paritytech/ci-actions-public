name: "Vertex AI Review"
description: "Posts an advisory PR review generated by Vertex AI (Gemini). Calls Vertex directly -- no Cloud Run/Function in the path."

inputs:
  github_token:
    description: "GitHub token used to fetch the diff and post the review (usually github.token)."
    required: true

  gcp_service_account:
    description: "GCP service account email to impersonate via Workload Identity Federation. Needs roles/aiplatform.user (or a scoped custom role) on the Vertex project."
    required: true

  gcp_workload_identity_provider:
    description: "Workload Identity Provider resource name for GitHub OIDC."
    required: true

  vertex_project:
    description: "GCP project hosting the Vertex AI endpoint."
    required: true

  vertex_location:
    description: "Vertex location. 'global' uses the unprefixed multi-region endpoint; any other value is used as a host prefix (e.g. europe-west3)."
    required: false
    default: "global"

  vertex_model:
    description: "Vertex publisher model id, e.g. gemini-3.7-flash or gemini-3-pro."
    required: false
    default: "gemini-3.7-flash"

  prompt_path:
    description: "Path to the prompt template. Defaults to the prompt.md shipped with this action. A repo-relative path is only usable if the caller checked out the base repo first."
    required: false
    default: ""

  pr_number:
    description: "Pull request number. Required for issue_comment triggers, where github.event.pull_request is absent."
    required: false
    default: ""

  max_diff_bytes:
    description: "Max bytes of diff to send. Above this the diff is truncated and the model is told so."
    required: false
    default: "400000"

  temperature:
    description: "Sampling temperature. Leave empty on Gemini 3 models -- Google's guidance is to keep their default of 1.0, since lowering it risks looping and degraded reasoning. An empty value sends no temperature at all."
    required: false
    default: ""

  seed:
    description: "Sampling seed. A fixed value asks the model for the same answer to the same diff, which Google documents as best effort. Change it to get a fresh opinion. Empty sends no seed."
    required: false
    default: "1"

  thinking_level:
    description: "Gemini 3 thinking budget: low, medium, or high. Thinking tokens count against max_output_tokens and are discarded before the review is posted, so a higher level needs a larger budget. Empty leaves the model default (medium)."
    required: false
    default: "medium"

  max_output_tokens:
    description: "Output token budget for the first attempt, thinking tokens included. A truncated or suspiciously short review is retried once with double this. The budget is a ceiling, not a spend: a retry re-sends the whole diff, so a ceiling high enough to finish in one attempt is usually cheaper than a tight one."
    required: false
    default: "16384"

  min_review_chars:
    description: "Reviews shorter than this trigger the single retry. 0 disables the length check."
    required: false
    default: "220"

  review_event:
    description: "GitHub review event type. COMMENT never blocks a merge."
    required: false
    default: "COMMENT"

  disclaimer:
    description: "Banner prepended to the posted review. Set empty to omit."
    required: false
    default: "> 🤖 AI-generated review — advisory only, not a substitute for human review."

outputs:
  review_path:
    description: "Path to the generated review text file."
    value: ${{ steps.review.outputs.review_path }}

  mode:
    description: "How complete the review input was: full, truncated, or file-list."
    value: ${{ steps.diff.outputs.mode }}

runs:
  using: "composite"
  steps:
    - name: Resolve PR number
      id: pr
      shell: bash
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
        if [[ -z "${PR_NUMBER}" ]]; then
          echo "Cannot determine PR number. Pass pr_number for issue_comment triggers." >&2
          exit 2
        fi
        echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google Cloud (WIF)
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        service_account: ${{ inputs.gcp_service_account }}
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        token_format: access_token
        create_credentials_file: false
        # Stops the action exporting GOOGLE_CLOUD_PROJECT and four aliases, which
        # put the project name in the log of every later step. Nothing here reads
        # them: the token comes from a step output and VERTEX_PROJECT is our own
        # input.
        export_environment_variables: false

    - name: Fetch PR diff and metadata
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
        SCRIPT: ${{ github.action_path }}/scripts/review.py
      run: |
        set -euo pipefail
        python3 "$SCRIPT" fetch-diff --out pr.diff --meta pr.meta.json

    - name: Generate review
      id: review
      shell: bash
      env:
        ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        VERTEX_PROJECT: ${{ inputs.vertex_project }}
        VERTEX_LOCATION: ${{ inputs.vertex_location }}
        VERTEX_MODEL: ${{ inputs.vertex_model }}
        TEMPERATURE: ${{ inputs.temperature }}
        SEED: ${{ inputs.seed }}
        THINKING_LEVEL: ${{ inputs.thinking_level }}
        MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
        MIN_REVIEW_CHARS: ${{ inputs.min_review_chars }}
        DIFF_MODE: ${{ steps.diff.outputs.mode }}
        PROMPT_INPUT: ${{ inputs.prompt_path }}
        SCRIPT: ${{ github.action_path }}/scripts/review.py
        DEFAULT_PROMPT: ${{ github.action_path }}/prompt.md
      run: |
        set -euo pipefail

        PROMPT="${PROMPT_INPUT:-$DEFAULT_PROMPT}"
        if [[ ! -f "${PROMPT}" ]]; then
          echo "Prompt template not found: ${PROMPT}" >&2
          exit 2
        fi

        URL="$(python3 "$SCRIPT" vertex-url)"

        # One retry, with double the output budget: MAX_TOKENS or a stub-length
        # answer is usually the budget, not the model giving up.
        for attempt in 1 2; do
          budget=$(( MAX_OUTPUT_TOKENS * attempt ))

          python3 "$SCRIPT" build-request \
            --prompt "${PROMPT}" \
            --diff pr.diff \
            --meta pr.meta.json \
            --mode "${DIFF_MODE}" \
            --max-output-tokens "${budget}" \
            --out req.json

          # Response bodies can carry PR content, so nothing here is echoed.
          http_code="$(curl -sS -L \
            -o resp.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${URL}" \
            -d @req.json || true)"

          if [[ "${http_code}" != "200" ]]; then
            echo "Vertex generateContent failed (HTTP ${http_code}) attempt ${attempt}" >&2
            exit 22
          fi

          verdict="$(python3 "$SCRIPT" extract-review \
            --response resp.json \
            --out review.txt \
            --min-chars "${MIN_REVIEW_CHARS}")"

          if [[ "${verdict}" == "ok" ]]; then
            break
          fi
          echo "attempt ${attempt} came back short or truncated" >&2
        done

        # A second truncated attempt writes no file, because the JSON could not
        # be parsed. Fail here rather than in the posting step.
        if [[ ! -s review.txt ]]; then
          echo "no review was produced after 2 attempts; raise max_output_tokens" >&2
          exit 22
        fi

        echo "review_path=review.txt" >> "$GITHUB_OUTPUT"

    - name: Post PR review
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REVIEW_EVENT: ${{ inputs.review_event }}
        DISCLAIMER: ${{ inputs.disclaimer }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const number = Number(process.env.PR_NUMBER);

          // Invisible in rendered markdown. It is how a later run recognises
          // the reviews this action wrote, so it must stay in the body.
          const MARKER = '<!-- vertex-ai-review -->';
          // Catches reviews written before MARKER existed. Only matches the
          // default disclaimer text.
          const LEGACY = 'AI-generated review';

          // Collapse earlier reviews before adding the new one, so the run does
          // not hide what it just posted. A submitted review cannot be deleted,
          // and minimizeComment is what the "hide comment" button calls.
          const { repository } = await github.graphql(`
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  reviews(last: 100) { nodes { id body isMinimized } }
                }
              }
            }`, { owner, repo, number });

          const stale = repository.pullRequest.reviews.nodes.filter(
            (r) => !r.isMinimized && r.body && (r.body.includes(MARKER) || r.body.includes(LEGACY))
          );
          for (const r of stale) {
            await github.graphql(`
              mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  clientMutationId
                }
              }`, { id: r.id });
          }
          core.info(`collapsed ${stale.length} earlier review(s)`);

          const review = fs.readFileSync('review.txt', 'utf8');
          const disclaimer = process.env.DISCLAIMER || '';
          const head = disclaimer ? `${MARKER}\n${disclaimer}` : MARKER;
          await github.rest.pulls.createReview({
            owner,
            repo,
            pull_number: number,
            body: `${head}\n\n${review}`,
            event: process.env.REVIEW_EVENT,
          });
